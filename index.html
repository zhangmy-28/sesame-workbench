.sidebar-title{font-size:11px;font-weight:600;color:var(--sesame);line-height:1.2}

.nav-item:active{transform:scale(.95)}
.nav-item .nav-icon{font-size:22px;line-height:1}
.nav-item .nav-label{font-size:10px;line-height:1.3;white-space:nowrap}
.nav-item.active{background:var(--sesame-cream);color:var(--sesame);font-weight:600}

.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}

.content-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 24px}
.card{background:var(--white);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);transition:transform .2s}
.card:active{transform:scale(.98)}
.card-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.card-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.card-title{font-size:15px;font-weight:600;color:var(--text);line-height:1.4;flex:1}
.card-body{font-size:13px;color:var(--text-light);line-height:1.7}

.outfit-item{background:var(--sesame-bg);border-radius:var(--radius-sm);padding:12px;text-align:center}
.outfit-item .outfit-emoji{font-size:36px;display:block;margin-bottom:6px}

@keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card,.dialogue-card,.daily-quote{animation:fadeInUp .35s ease forwards}
</style>

// ===== 尝试加载 data.json =====
function loadLiveData(callback){
var xhr = new XMLHttpRequest();
xhr.open('GET', 'data.json', true);
xhr.timeout = 5000;
xhr.onload = function(){
if(xhr.status === 200){
try{
var d = JSON.parse(xhr.responseText);
if(d && d.updateTime){
d.isLive = true;
callback(d);
return;
}
}catch(e){}
}
callback(FALLBACK_DATA);
};
xhr.onerror = function(){ callback(FALLBACK_DATA); };
xhr.ontimeout = function(){ callback(FALLBACK_DATA); };
xhr.send();
}

function renderHeader(catKey){
var meta = categoriesMeta[catKey];
var h = '<div class="category-title"><span>'+meta.icon+'</span> '+meta.title+'</div>';
h += '<div class="category-subtitle">'+meta.subtitle+'</div>';
h += '<span class="date-badge">📅 '+DATA.updateDate+' 星期'+DATA.weekDay+'</span>';
if(DATA.isLive && DATA.updateTime){
h += '<span class="update-badge">⚡ 自动更新</span>';
}
document.getElementById('mainHeader').innerHTML = h;
}

function renderTech(){
renderHeader('tech');
var s = document.getElementById('contentScroll');
s.innerHTML = '';
(DATA.tech||[]).forEach(function(item,i){
var el = document.createElement('div');
el.style.animationDelay = (i*0.05)+'s';
if(item.type === 'daily-quote'){
el.className = 'daily-quote';
el.innerHTML = '<div class="quote-text">'+item.text+'</div><div class="quote-author">'+item.author+'</div>';
}else{
el.className = 'card';
var th = item.tags ? '<div class="card-tags">'+item.tags.map(function(t){return '<span class="tag" style="background:'+t.bg+';color:'+t.color+';">'+t.text+'</span>';}).join('')+'</div>' : '';

}
s.appendChild(el);
});
}

el.className = 'card';
el.style.animationDelay = (i*0.05)+'s';
var textHtml = item.text.replace(/\n/g,'<br>');
el.innerHTML = '<div class="card-header"><div class="card-icon" style="background:#F6F2FA;">🎵</div><div class="card-title">'+item.level_text+' | '+item.title+'</div></div><div class="card-body"><p><em>语速：'+item.speed+' | '+item.duration+' | '+item.difficulty+'</em></p><p style="background:#F9F6FC;padding:10px;border-radius:8px;font-size:13px;">'+textHtml+'</p><p>📝 '+(item.vocab||[]).join(' / ')+'</p></div><div class="card-tags">'+(item.tags||[]).map(function(t){return '<span class="tag" style="background:#F6F2FA;color:#9070B0;">'+t+'</span>';}).join('')+'</div>';
s.appendChild(el);
});
}

function renderFashion(){
renderHeader('fashion');
var s = document.getElementById('contentScroll');
s.innerHTML = '';
var f = DATA.fashion;
// 色彩搭配卡片
if(f.color_tip){
var el = document.createElement('div');
el.className = 'card';
var dots = (f.color_tip.colors||[]).map(function(c){return '<div class="color-dot" style="background:'+c+'"></div>';}).join('');
var names = (f.color_tip.color_names||[]).join(' / ');
el.innerHTML = '<div class="card-header"><div class="card-icon" style="background:#FDF2F5;">🎨</div><div class="card-title">今日色彩搭配：'+f.color_tip.title+'</div></div><div class="card-body"><p>'+f.color_tip.desc+'</p><p>搭配公式：'+f.color_tip.formula+'</p><div class="color-palette">'+dots+'</div><p style="font-size:11px;color:var(--text-muted);margin-top:6px;">🎨 '+names+'</p></div><div class="card-tags"><span class="tag" style="background:#FDF2F5;color:#C08090;">橄榄皮</span><span class="tag" style="background:#FDF2F5;color:#C08090;">色彩搭配</span></div>';
s.appendChild(el);
}
// 穿搭 looks
(f.looks||[]).forEach(function(look,i){
var el = document.createElement('div');
el.className = 'card';
el.style.animationDelay = (i*0.05)+'s';
el.innerHTML = '<div class="card-header"><div class="card-icon" style="background:#FDF2F5;">'+(i===0?'👚':'👗')+'</div><div class="card-title">Look '+(i+1)+' | '+look.title+'</div></div><div class="card-body"><div class="outfit-grid"><div class="outfit-item"><span class="outfit-emoji">'+look.top.emoji+'</span><div class="outfit-name">上衣</div><div class="outfit-desc">'+look.top.desc+'</div></div><div class="outfit-item"><span class="outfit-emoji">'+look.bottom.emoji+'</span><div class="outfit-name">下装</div><div class="outfit-desc">'+look.bottom.desc+'</div></div></div><p style="margin-top:8px;">✨ '+look.tips+'</p></div><div class="card-tags">'+(look.tags||[]).map(function(t){return '<span class="tag" style="background:#FDF2F5;color:#C08090;">'+t+'</span>';}).join('')+'</div>'+(look.search_url?'<a href="'+look.search_url+'" target="_blank" rel="noopener" class="source-link">📎 搜索同款 →</a>':'');
s.appendChild(el);
});
// 鞋履推荐
if(f.shoes){
var el = document.createElement('div');
el.className = 'card';
el.innerHTML = '<div class="card-header"><div class="card-icon" style="background:#FDF2F5;">👠</div><div class="card-title">鞋履推荐 | 小个子增高单鞋&凉鞋</div></div><div class="card-body">'+f.shoes.items.map(function(si){return '<p>'+si+'</p>';}).join('')+'<p>💡 '+f.shoes.tip+'</p></div><div class="card-tags"><span class="tag" style="background:#FDF2F5;color:#C08090;">增高鞋</span></div>';
s.appendChild(el);
}
}

function renderBlog(){
renderHeader('blog');
var s = document.getElementById('contentScroll');
s.innerHTML = '';
(DATA.blog||[]).forEach(function(item,i){
var el = document.createElement('div');
el.className = 'card';
el.style.animationDelay = (i*0.05)+'s';
var th = item.tags ? '<div class="card-tags">'+item.tags.map(function(t){return '<span class="tag" style="background:'+t.bg+';color:'+t.color+';">'+t.text+'</span>';}).join('')+'</div>' : '';
el.innerHTML = '<div class="card-header"><div class="card-icon" style="background:'+(item.iconBg||'#FFF9E8')+';">'+(item.icon||'📝')+'</div><div class="card-title">'+item.title+'</div></div><div class="card-body">'+item.body+'</div>'+th+(item.source?'<a href="'+item.source.url+'" target="_blank" rel="noopener" class="source-link">📎 '+item.source.label+' →</a>':'');
s.appendChild(el);
});
}

var renderFunctions = {
tech: renderTech,
trade: renderTrade,
speaking: renderSpeaking,
listening: renderListening,
fashion: renderFashion,
blog: renderBlog
};

function renderCategory(catKey){
var fn = renderFunctions[catKey];
if(fn){ fn(); }
}

// ===== 导航切换 =====
document.getElementById('navList').addEventListener('click',function(e){
var nav = e.target.closest('.nav-item');
if(!nav) return;
document.querySelectorAll('.nav-item').forEach(function(n){n.classList.remove('active');});
nav.classList.add('active');
renderCategory(nav.dataset.cat);
});

// ===== 启动：加载数据 → 渲染 =====
loadLiveData(function(loadedData){
DATA = loadedData;
renderCategory('tech');
});
</script>
</body>
</html>
