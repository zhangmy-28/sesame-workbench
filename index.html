function renderContent(catKey){
var cat=categories[catKey];
if(!cat)return;
document.getElementById('mainHeader').innerHTML='<div class="category-title"><span>'+cat.icon+'</span> '+cat.title+'</div><div class="category-subtitle">'+cat.subtitle+'</div><div class="date-badge">📅 '+dateStr+' 星期'+dayOfWeek+'</div>';
var scroll=document.getElementById('contentScroll');
scroll.innerHTML='';
scroll.scrollTop=0;
cat.content.forEach(function(item,index){
var el=document.createElement('div');
el.style.animationDelay=(index*0.05)+'s';
if(item.type==='dialogue-card'){
el.className='dialogue-card';
var dh=item.dialogue.map(function(d){return '<div class="dialogue-line"><span class="speaker">'+d.speaker+':</span><span class="text">'+d.text+'</span></div>';}).join('');
el.innerHTML='<div style="font-weight:600;font-size:14px;margin-bottom:8px;color:var(--sesame);">'+item.title+'</div>'+dh+'<p style="font-size:11px;color:var(--text-muted);margin-top:8px;">'+item.tips+'</p>'+(item.source?'<a href="'+item.source.url+'" target="_blank" rel="noopener" class="source-link">📎 '+item.source.label+' →</a>':'');
}else if(item.type==='daily-quote'){
el.className='daily-quote';
el.innerHTML='<div class="quote-text">'+item.text+'</div><div class="quote-author">'+item.author+'</div>';
}else{
el.className='card';
var th='';
if(item.tags){th='<div class="card-tags">'+item.tags.map(function(t){return '<span class="tag" style="background:'+t.bg+';color:'+t.color+';">'+t.text+'</span>';}).join('')+'</div>';}
el.innerHTML='<div class="card-header"><div class="card-icon" style="background:'+item.iconBg+';">'+item.icon+'</div><div class="card-title">'+item.title+'</div></div><div class="card-body">'+item.body+'</div>'+th+(item.source?'<a href="'+item.source.url+'" target="_blank" rel="noopener" class="source-link">📎 来源：'+item.source.label+' →</a>':'');
}
scroll.appendChild(el);
});
}
document.getElementById('navList').addEventListener('click',function(e){
var nav=e.target.closest('.nav-item');
if(!nav)return;
document.querySelectorAll('.nav-item').forEach(function(n){n.classList.remove('active');});
nav.classList.add('active');
renderContent(nav.dataset.cat);
});
renderContent('tech');
</script>
