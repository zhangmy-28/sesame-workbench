name: 每日更新芝麻油工作台

on:
  schedule:
    # 北京时间每天早上 8:00 (UTC+8 = UTC 0:00)
    - cron: '0 0 * * *'
  # 允许手动触发（在Actions页面点Run workflow）
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 安装依赖
        run: pip3 install requests
      
      - name: 运行内容抓取脚本
        run: python3 update_content.py
      
      - name: 提交并推送更新
        run: |
          git config user.name "Sesame Bot 🤖"
          git config user.email "bot@sesame-workbench.local"
          git add data.json
          if ! git diff --staged --quiet; then
            git commit -m "📰 每日自动更新 - $(TZ='Asia/Shanghai' date '+%Y-%m-%d')"
            git push
            echo "✅ 内容已更新并推送"
          else
            echo "⏭ 内容无变化，跳过提交"
          fi
